<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="/images/Betterside Logo 1.png">
    <meta charset="UTF-8">
    <title>Sign Up | BetterSide</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/subpage/Login/login.css">
</head>
<body>

    <div class="page-wrapper">
        <div class="card">

            <div class="logo">
                <img src="/subpage/Login/media/image/Betterside_Logo_1_1-removebg-preview.png" alt="BetterSide Logo">
            </div>

            <a href="index.html" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <h1>Login Account</h1>
            <p class="subtitle">Enter your details to get started</p>

            <form id="loginForm">

                <div class="input-group">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user input-icon"></i>
                        <input type="email" name="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" name="password" id="passwordInput" placeholder="Enter your password" required>
                        <i class="fa-regular fa-eye-slash toggle-password" id="togglePassword"></i>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Log In</button>

            </form>

            <div style="text-align: center; margin-top: 24px; font-size: 13px; color: #6b7280;">
                If you don't have an account? <a href="sign-up.html" style="color: #2563eb; text-decoration: none; font-weight: 500;">Sign up</a>
            </div>

        </div>
    </div>

    <script>
        // LOGIN SYSTEM
        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const email = formData.get("email");
            const password = formData.get("password");

            try {
                const res = await fetch("https://betterside-api.onrender.com/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem("userName", data.user.name);
                    localStorage.setItem("userRole", data.user.role);
                    alert("Login successful 🎉");
                    window.location.href = "../Dashboard/dashboard.html";
                } else {
                    alert(data.message);
                }

            } catch (err) {
                alert("Server error");
            }
        });

        // Show/Hide Password
        const passwordInput = document.getElementById('passwordInput');
        const togglePassword = document.getElementById('togglePassword');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    </script>

</body>
</html>
